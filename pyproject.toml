[project]
name = "swat"
version = "0.1.0"
description = "Monitor CT Logs for Brand Abuse w/ Semantic Search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "sentence-transformers>=5.0.0",
    "tldextract>=5.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: spawns a subprocess (slower, still runs by default)"]
